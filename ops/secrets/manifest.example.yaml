version: 1

owners:
  platform: PlatformReliabilityLead
  product: ProductEngineeringLead
  qa: QualityAutomationLead

secrets:
  - name: OPENAI_API_KEY
    ownerRole: platform
    consumerRoles:
      - product
    environments:
      - staging
      - production
    delivery: runtime_env
    rotation: manual_90d
    notes: Shared AI-provider credential for application runtimes.

  - name: OBSERVABILITY_DSN
    ownerRole: platform
    consumerRoles:
      - platform
      - product
    environments:
      - staging
      - production
    delivery: runtime_env
    rotation: on_provider_change
    notes: Error tracking and trace export endpoint.

  - name: DATABASE_URL
    ownerRole: platform
    consumerRoles:
      - product
    environments:
      - staging
      - production
    delivery: secret_manager_ref
    rotation: on_credential_change
    notes: Managed database connection string per environment.

  - name: REDIS_URL
    ownerRole: platform
    consumerRoles:
      - product
    environments:
      - staging
      - production
    delivery: secret_manager_ref
    rotation: on_credential_change
    notes: Queue and cache runtime endpoint.

  - name: X402_WEBHOOK_SECRET
    ownerRole: platform
    consumerRoles:
      - product
      - qa
    environments:
      - staging
      - production
    delivery: runtime_env
    rotation: manual_90d
    notes: Shared-secret verification for x402 callbacks.

  - name: ERC8004_RPC_URL
    ownerRole: platform
    consumerRoles:
      - product
    environments:
      - local
      - staging
      - production
    delivery: runtime_env
    rotation: on_provider_change
    notes: Chain RPC endpoint; split by environment when production infra exists.

  - name: WALLET_SIGNER_KEY_REF
    ownerRole: platform
    consumerRoles:
      - product
    environments:
      - staging
      - production
    delivery: secret_manager_ref
    rotation: on_key_rotation
    notes: Reference to platform-managed signer material, never the raw key.
